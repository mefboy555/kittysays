[package]
name = "kittysays"
version = "0.1.5"
edition = "2024"
description = "A \"cowsay\" clone with Boykisser ASCII art and speech bubbles."
license = "MIT"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2.2"
rand = "0.9.2"
clap = { version = "4.5.57", features = ["derive"] }
# sysinfo removed; using env var heuristics instead

# Windows console API to enable virtual terminal processing (ANSI)
winapi = { version = "0.3", features = ["consoleapi", "wincon", "processenv", "handleapi", "winbase"] }
